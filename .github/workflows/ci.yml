name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build
    - name: Format
      run: cargo fmt --message-format human -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -Dwarnings
    - name: Document
      run: cargo doc
      env:
        RUSTDOCFLAGS: "-D warnings"
    - name: Test
      # debug_eu_offsets is marked #[ignore] (known-failing debug helper,
      # see its own doc comment in prover_v8_test.rs) rather than skipped
      # via a CLI flag here - the bench targets below are harness=false
      # (criterion) and don't understand libtest's `--skip`, so any skip
      # flag added at this level would break them instead.
      run: cargo test
    - name: Test benchmarks
      run: cargo test --benches
    - name: "Check for #[test] macro"
      run: |
        bash -c "! grep -r '#\[test\]' src"
    - name: Check uniffi build
      run: cargo check --features uniffi
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2.0.15
      with:
        command: check bans licenses sources

  wasm-node:
    runs-on: ubuntu-latest
    steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Install Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "22"
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.7
    - name: Install wasm-pack
      run: cargo binstall wasm-pack --version 0.13.1
    - uses: actions/checkout@v5
    - name: Test (Node.js)
      run: wasm-pack test --node

  wasm-firefox:
    runs-on: ubuntu-latest
    steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.7
    - name: Install wasm-pack
      run: cargo binstall wasm-pack --version 0.13.1
    - uses: actions/checkout@v5
    - name: Test (Firefox)
      run: wasm-pack test --firefox --headless
      env:
        WASM_BINDGEN_USE_BROWSER: "1"

  rustsec-advisories:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2.0.15
      with:
        command: check advisories
